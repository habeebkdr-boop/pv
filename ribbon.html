<!DOCTYPE html>
<html lang="ml">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Malayalam:wght@700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;}
body{overflow:hidden;}
.ribbon{background:#1a56db;color:#fff;padding:8px 0;overflow:hidden;white-space:nowrap;}
.ribbon-text{display:inline-block;animation:scroll-left 20s linear infinite;font-size:13px;font-weight:700;font-family:'Noto Sans Malayalam',sans-serif;}
@keyframes scroll-left{0%{transform:translateX(100vw);}100%{transform:translateX(-100%);}}
</style>
</head>
<body>
<div class="ribbon">
  <span class="ribbon-text">
    🔔 ഏപ്രിൽ 5 നു മുൻപ് പേയ്മെന്റ് നടത്തുക &nbsp;&nbsp;&nbsp;|&nbsp;&nbsp;&nbsp;
    💰 Subscription സംഖ്യ ഉയർത്തൂ, മാറ്റം സുനിക്ഷിതം &nbsp;&nbsp;&nbsp;|&nbsp;&nbsp;&nbsp;
    📢 കുടുംബത്തിൽ എല്ലാവരെയും ഈ സ്കീമിൽ പങ്കാളികളാക്കൂ🙏
  </span>
</div>
</body>
</html>
