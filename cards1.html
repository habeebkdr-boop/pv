<!DOCTYPE html>
<html lang="ml">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PVSS Cards</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Malayalam:wght@400;600;700;800&family=Playfair+Display:wght@700;900&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }

  body {
    background:transparent;
    font-family:'Noto Sans Malayalam','Nunito',sans-serif;
    margin:0;
    padding:0;
    overflow:hidden;
  }

  .wrapper {
    width:100%;
    max-width:480px;
  }

  /* Header */
  .hdr {
    padding:0 20px 14px;
    display:flex;
    align-items:center;
    justify-content:space-between;
  }
  .hdr-title {
    font-size:20px;
    font-weight:800;
    color:#6b7280;
    letter-spacing:1.5px;
    text-transform:uppercase;
  }
  /* Dot indicators */
  .dots {
    display:flex;
    gap:5px;
    align-items:center;
  }
  .dot {
    width:6px; height:6px;
    border-radius:50%;
    background:#d1d5db;
    transition:all 0.3s;
  }
  .dot.active {
    width:18px;
    border-radius:3px;
    background:#1a56db;
  }

  /* Slider */
  .slider {
    display:flex;
    overflow-x:auto;
    scroll-snap-type:x mandatory;
    -webkit-overflow-scrolling:touch;
    scrollbar-width:none;
    gap:14px;
    padding:4px 20px 16px;
  }
  .slider::-webkit-scrollbar { display:none; }

  /* Card */
  .card {
    min-width:108%;
    max-width:105%;
    scroll-snap-align:start;
    flex-shrink:0;
    border-radius:20px;
    padding:18px 16px;
    position:relative;
    overflow:hidden;
    height:100px;
    display:flex;
    flex-direction:column;
    gap:8px;
    cursor:pointer;
    transition:transform 0.2s;
  }
  .card:active { transform:scale(0.98); }

  /* Card themes */
  .card-1 { background:linear-gradient(135deg,#1a3a2a,#2e7d32); }
  .card-2 { background:linear-gradient(135deg,#1e3a8a,#1a56db); }
  .card-3 { background:linear-gradient(135deg,#78350f,#c8820a); }
  .card-4 { background:linear-gradient(135deg,#1e1b4b,#4338ca); }

  /* Decorative circle */
  .card::before {
    content:'';
    position:absolute;
    top:-40px; right:-40px;
    width:160px; height:160px;
    border-radius:50%;
    background:rgba(255,255,255,0.07);
  }
  .card::after {
    content:'';
    position:absolute;
    bottom:-50px; left:-20px;
    width:130px; height:130px;
    border-radius:50%;
    background:rgba(255,255,255,0.05);
  }

  .card-num {
    font-size:10px;
    font-weight:800;
    color:rgba(255,255,255,0.45);
    letter-spacing:2px;
    text-transform:uppercase;
    margin-bottom:5px;
    font-family:'Nunito',sans-serif;
  }

  .card-title {
    font-size:18px;
    font-weight:800;
    color:#fff;
    line-height:1.4;
    font-family:'Noto Sans Malayalam',sans-serif;
    word-break:break-word;
  }

  .card-desc {
    font-size:14px;
    color:rgba(255,255,255,0.7);
    line-height:1.6;
    font-weight:600;
    font-family:'Noto Sans Malayalam',sans-serif;
    word-break:break-word;
    white-space:normal;
  }

  /* Swipe hint */
  .hint {
    text-align:center;
    font-size:11px;
    color:#9ca3af;
    font-weight:700;
    padding-top:4px;
    font-family:'Nunito',sans-serif;
    letter-spacing:0.3px;
  }
</style>
</head>
<body>

<div class="wrapper">

  <div class="slider" id="slider">

    <!-- Card 1 -->
    <div class="card card-1">
      <div class="card-num">01 / 04</div>
        <div class="card-title">    </div>
    </div>

    <!-- Card 2 -->
    <div class="card card-2">
      <div class="card-num">02 / 04</div>
        <div class="card-title">  </div>
        
    </div>

    <!-- Card 3 -->
    <div class="card card-3">
      <div class="card-num">03 / 04</div>
        <div class="card-title">   </div>
    </div>

    <!-- Card 4 -->
    <div class="card card-4">
      <div class="card-num">04 / 04</div>
        <div class="card-title">   </div>
    </div>

  </div>


<script>
  const slider = document.getElementById('slider');
  const cards  = slider.querySelectorAll('.card');
  
  let current  = 0;
  let autoTimer;

  function goTo(index) {
    current = index;
    const card = cards[index];
    slider.scrollTo({ left: card.offsetLeft - 20, behavior: 'smooth' });
  }

  function next() {
    goTo((current + 1) % cards.length);
  }

  function startAuto() {
    clearInterval(autoTimer);
    autoTimer = setInterval(next, 3500);
  }

  // Pause auto-scroll on user touch
  slider.addEventListener('touchstart', () => clearInterval(autoTimer), {passive:true});
  slider.addEventListener('touchend',   () => { detectCurrent(); startAuto(); }, {passive:true});

  // Detect which card is visible after manual scroll
  function detectCurrent() {
    const scrollLeft = slider.scrollLeft;
    let closest = 0, minDist = Infinity;
    cards.forEach((c, i) => {
      const dist = Math.abs(c.offsetLeft - 20 - scrollLeft);
      if (dist < minDist) { minDist = dist; closest = i; }
    });
    current = closest;
    
  }

  slider.addEventListener('scroll', detectCurrent, {passive:true});

  // Start
  startAuto();
</script>

</body>
</html>
